name: Submit a template
description: Share a paper template with everyone who uses FineNotes. No git needed.
title: "Template: "
labels: [submission]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing! Fill this in and drag your template into **Files**: a **PDF, PNG or JPEG**, at most 40 MB. A preview is made for you.

        A bot turns this into a submission within a minute or two and replies here. Once it is reviewed, your template appears in every FineNotes user's gallery. Only submit designs that are yours to share.
  - type: input
    id: name
    attributes:
      label: Name
      placeholder: Weekly planner
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Your name, as it should show
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options: [Planner, Study, Journal, Work, Paper, Other]
    validations:
      required: true
  - type: dropdown
    id: licence
    attributes:
      label: Licence
      options:
        - Personal use only
        - Personal and commercial use
        - CC BY 4.0 (share and adapt, with credit)
        - CC0 (no rights reserved)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: Monday start, with an index page that links to each day.
  - type: input
    id: tags
    attributes:
      label: Tags
      description: A few words, separated by commas.
      placeholder: weekly, hyperlinked
  - type: textarea
    id: files
    attributes:
      label: Files
      description: Drag your template here. Add a picture of its first page too only if you want your own preview.
    validations:
      required: true
  - type: checkboxes
    id: rights
    attributes:
      label: Rights
      options:
        - label: I made this template, or have the right to share it under the licence above.
          required: true
