name: Templates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Every pull request: each template is checked (fields, licence, file
      # types by their contents, sizes). Nothing is built.
      - if: github.event_name == 'pull_request'
        run: node scripts/build-index.mjs --check
      # On main: a picture of every page of each template, then index.json;
      # both committed when they changed.
      - if: github.event_name == 'push'
        run: sudo apt-get install -y --no-install-recommends poppler-utils
      - if: github.event_name == 'push'
        run: |
          node scripts/make-previews.mjs
          node scripts/build-index.mjs
          git add index.json templates
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Rebuild page previews and index.json"
            git push
          fi
