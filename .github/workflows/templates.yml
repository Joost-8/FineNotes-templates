name: Templates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Every pull request: each template is checked (fields, licence, file
      # types by their contents, sizes). Nothing is built.
      - if: github.event_name == 'pull_request'
        run: node scripts/build-index.mjs --check
      # On main: build index.json and commit it when it changed.
      - if: github.event_name == 'push'
        run: |
          node scripts/build-index.mjs
          if ! git diff --quiet index.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.json
            git commit -m "Rebuild index.json"
            git push
          fi
